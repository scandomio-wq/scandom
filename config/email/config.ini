[smtp]
# Ces valeurs peuvent être surchargées par des variables d'environnement
host = ${SMTP_HOST}
port = ${SMTP_PORT}
user = ${SMTP_USER}
password = ${SMTP_PASSWORD}
from_email = ${SMTP_FROM_EMAIL}
use_tls = ${SMTP_USE_TLS}

[retry]
max_retries = ${EMAIL_MAX_RETRIES}
retry_delay = ${EMAIL_RETRY_DELAY}
