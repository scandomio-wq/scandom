[twilio]
# Configurez ces valeurs via variables d'environnement ou remplacez par vos identifiants
# IMPORTANT: Ne jamais commiter de secrets dans le dépôt Git
account_sid = ${TWILIO_ACCOUNT_SID}
auth_token = ${TWILIO_AUTH_TOKEN}
whatsapp_number = ${TWILIO_WHATSAPP_NUMBER}
webhook_url = ${TWILIO_WEBHOOK_URL}
webhook_status_url = ${TWILIO_WEBHOOK_STATUS_URL}

[redis]
host = localhost
port = 6379
db = 0
password = 
ttl = 86400  # 24 heures en secondes

[celery]
broker_url = redis://localhost:6379/0
result_backend = redis://localhost:6379/0
task_serializer = json
accept_content = ["json"]
result_serializer = json
timezone = Europe/Paris
enable_utc = True
worker_concurrency = 4
task_acks_late = True
task_reject_on_worker_lost = True

[conversation]
max_retries = 5
retry_delay = 300  # 5 minutes en secondes
backoff_factor = 2  # Multiplication du délai à chaque tentative
timeout_warning = 600  # 10 minutes en secondes
max_interactions = 20

[logging]
level = INFO
file = /home/jeremy/Documents/Projet/scandom/logs/whatsapp.log
format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(message)s
max_size = 10485760
backup_count = 5

[metrics]
enabled = True
endpoint = /metrics
collection_interval = 15  # en secondes

[retention]
conversation_days = 365  # 1 an
message_days = 365  # 1 an
pending_incident_days = 30  # 30 jours
anonymize_after_days = 180  # 6 mois

[templates]
# Content SID des templates approuvés par Meta
zone_selection = HXef3cdf175c6234e02fd4622a50a442bb
